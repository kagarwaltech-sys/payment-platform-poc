services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://payments:payments@db:5432/payments?sslmode=disable
      PAYMENT_PROCESSOR: ${PAYMENT_PROCESSOR:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PAYMENT_METHOD: ${STRIPE_PAYMENT_METHOD:-pm_card_visa}
      PROCESSOR_AMOUNT_THRESHOLD: ${PROCESSOR_AMOUNT_THRESHOLD:-10000}
      PROCESSOR_ADYEN_THRESHOLD: ${PROCESSOR_ADYEN_THRESHOLD:-50000}
      ADYEN_API_KEY: ${ADYEN_API_KEY:-}
      ADYEN_MERCHANT_ACCOUNT: ${ADYEN_MERCHANT_ACCOUNT:-}
      ADYEN_BASE_URL: ${ADYEN_BASE_URL:-https://checkout-test.adyen.com/v71}
      ADYEN_PAYMENT_METHOD_JSON: ${ADYEN_PAYMENT_METHOD_JSON:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "3000:80"
    restart: unless-stopped

  demo-gateway:
    build:
      context: ../../..
      dockerfile: payment-platform-poc/payment-platform-poc-docs/payment-platform-poc/demo-gateway/Dockerfile
    environment:
      PAYMENT_API_URL: http://api:8080
      MCP_SERVER_COMMAND: /usr/local/bin/payment-platform-mcp
      PAYMENT_API_TOKEN: ${PAYMENT_API_TOKEN:-}
    depends_on:
      - api
    ports:
      - "8081:8081"
    restart: unless-stopped

volumes:
  postgres-data:
